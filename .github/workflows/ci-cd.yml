name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # Test & Lint Backend (Python)
  # ============================================================
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/ --select=E,W,F
          echo "✓ Ruff linting passed"

      - name: Dead-code scan (vulture, advisory)
        continue-on-error: true
        run: |
          vulture
          echo "✓ Vulture scan complete (advisory — does not block the build)"

      - name: Run tests with pytest
        run: |
          pytest backend/tests/ -v --tb=short -m "not acceptance"
          echo "✓ All tests passed"

      - name: Test coverage
        run: |
          pytest backend/tests/ --cov=backend --cov-report=term-missing -m "not acceptance"
          echo "✓ Coverage report generated"

  # ============================================================
  # Test & Lint Frontend (TypeScript/React)
  # ============================================================
  frontend-test:
    name: Frontend Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend project exists
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not found yet — skipping frontend tests (REQ-003 not implemented)"
          fi

      - name: Set up Node.js ${{ matrix.node-version }}
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint with ESLint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm run lint
          echo "✓ ESLint passed"

      - name: Type check
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm run type-check
          echo "✓ Type checking passed"

      - name: Dead-code scan (knip, advisory)
        if: steps.check.outputs.exists == 'true'
        continue-on-error: true
        working-directory: frontend
        run: |
          npm run deadcode
          echo "✓ Knip scan complete (advisory — does not block the build)"

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm run build
          echo "✓ Build successful"

  # ============================================================
  # Deploy to the DEV Uberspace (on push to develop)
  # ============================================================
  deploy-dev:
    name: Deploy to Dev Uberspace
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://mattdev.uber.space/picnic
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UBERSPACE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.UBERSPACE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy develop to Dev Uberspace
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.UBERSPACE_SSH_PORT }} \
            ${{ secrets.UBERSPACE_USER }}@${{ secrets.UBERSPACE_HOST }} \
            "DEPLOY_REF=develop PUBLIC_BASE_URL=https://mattdev.uber.space/picnic bash -s" < scripts/deploy.sh
          echo "✓ Dev deployment successful"

  # ============================================================
  # Acceptance tests against the running DEV deployment
  # A red run here blocks promotion to production (REQ-015).
  # ============================================================
  acceptance:
    name: Acceptance Tests (Dev)
    needs: deploy-dev
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://mattdev.uber.space/picnic
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run acceptance tests against Dev
        run: |
          pytest backend/tests/acceptance/ -v -m acceptance
          echo "✓ Acceptance tests passed against $BASE_URL"

  # ============================================================
  # Deploy to PRODUCTION (on push to main, manual approval gate)
  # The `production` environment carries a required-reviewer rule
  # so this job waits for approval before running (REQ-015).
  # ============================================================
  deploy-prod:
    name: Deploy to Production Uberspace
    needs: [backend-test, frontend-test, acceptance]
    runs-on: ubuntu-latest
    # On a push to main, deploy-dev/acceptance are skipped (they gate the develop
    # branch); the acceptance gate for main is enforced by branch protection
    # requiring the develop pipeline to pass before merge (see docs/DEPLOYMENT.md).
    # `always()` lets this job run despite those skips, while still requiring the
    # test jobs to have succeeded and acceptance not to have failed.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.backend-test.result == 'success' &&
      needs.frontend-test.result == 'success' &&
      needs.acceptance.result != 'failure'
    environment:
      name: production
      url: https://matt-maxx.de/picnic
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UBERSPACE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.UBERSPACE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy main to Production Uberspace
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.UBERSPACE_SSH_PORT }} \
            ${{ secrets.UBERSPACE_USER }}@${{ secrets.UBERSPACE_HOST }} \
            "DEPLOY_REF=main PUBLIC_BASE_URL=https://matt-maxx.de/picnic bash -s" < scripts/deploy.sh
          echo "✓ Production deployment successful"

      - name: Verify deployment
        run: |
          curl -f https://matt-maxx.de/picnic/health || echo "Warning: Health check failed (app may still be starting)"

      - name: Slack notification (optional)
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Picnic deployment to https://matt-maxx.de/picnic - ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
